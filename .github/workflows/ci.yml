name: CI

# Runs on every push and pull request to the main branches. The three jobs are
# independent, so they run in parallel and a frontend failure does not hide a
# backend failure.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'        # matches <java.version> in backend/pom.xml
          distribution: temurin
          cache: maven              # caches ~/.m2 between runs

      - name: Run tests
        working-directory: backend
        # No database service is needed: the test suite runs against in-memory
        # H2 via @ActiveProfiles("test"). That is only true because
        # ScmBackendApplicationTests was fixed to activate the test profile —
        # before that it tried to reach a real PostgreSQL on localhost:5432 and
        # could only pass on a developer machine.
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Build jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Upload test reports
        # `always()` so the reports are still uploaded when tests FAIL — which
        # is exactly when you want to read them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  ml-service:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ml-service
        # The suite needs no database — every test covers either the pure
        # forecasting engine or a stateless HTTP endpoint.
        run: pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* is inlined at build time, so the build needs a value.
          # It is a placeholder here — CI only proves the project compiles.
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
